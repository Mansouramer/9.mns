<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مركز قيادة العلوم – المعلم منصور عامر الرحيلي</title>
<meta name="theme-color" content="#05060f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --void:#05060f; --deep:#0b0d22;
  --panel:rgba(16,18,42,.74); --panel-solid:#11132c;
  --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.2);
  --ink:#eceffd; --ink-dim:#a6acce; --ink-faint:#7178a0;
  --accent:#47b8ff; --accent-rgb:71,184,255; --accent-ink:#04121c;
  --good:#5eead4; --warn:#ffcf70; --bad:#ff7a88; --sun:#ffb547;
  --display:'Lalezar','Readex Pro',Tahoma,sans-serif;
  --body:'Readex Pro','Segoe UI',Tahoma,sans-serif;
}
html{background:#05060f;color:#eceffd;scroll-behavior:smooth}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{
  margin:0;font-family:var(--body);font-size:15px;line-height:1.6;color:var(--ink);
  background:
    radial-gradient(900px 520px at 90% -8%,rgba(96,58,190,.34),transparent 70%),
    radial-gradient(800px 520px at -10% 38%,rgba(var(--accent-rgb),.13),transparent 70%),
    var(--void);
  background-attachment:fixed;min-height:100vh;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));
}
body.locked{overflow:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1}
h1,h2,h3,h4,h5,p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
a{color:var(--accent)}

.lock{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(700px 500px at 50% 30%,rgba(60,40,140,.5),transparent 70%),rgba(5,6,15,.94);}
.lock-card{width:100%;max-width:360px;text-align:center}
.lock-card svg{width:150px;height:150px;margin:0 auto 6px;display:block}
.lock-card h1{font-family:var(--display);font-size:34px;font-weight:400}
.lock-card .sub{color:var(--ink-dim);font-size:13px;margin:2px 0 22px}
.lock-card input[type=password]{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line-strong);
  background:rgba(255,255,255,.06);text-align:center;letter-spacing:6px;margin-bottom:10px}
.lock-msg{min-height:22px;font-size:13px;color:var(--bad);margin:2px 0 8px}
.lock-msg.ok{color:var(--good)}
.remember{display:flex;gap:8px;justify-content:center;align-items:center;font-size:13px;color:var(--ink-dim);margin:6px 0 14px}
.remember input{accent-color:var(--accent);width:16px;height:16px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;max-width:1040px;margin:0 auto}
.brand{display:flex;flex-direction:column;line-height:1.3}
.brand b{font-size:14px;font-weight:600}
.brand span{font-size:12px;color:var(--ink-dim)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
main{max-width:1040px;margin:0 auto;padding:0 14px}
.view{display:none}
.view.active{display:block}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:16px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.hint{font-size:12px;color:var(--ink-dim)}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line-strong);background:rgba(255,255,255,.055);color:var(--ink);min-height:44px}
select option{background:#11132c;color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.tabbar{position:fixed;bottom:0;right:0;left:0;z-index:30;display:flex;justify-content:center;padding:0 10px 8px}
.tabbar-in{display:flex;width:100%;max-width:560px;padding:6px;border-radius:22px;background:rgba(12,14,34,.88);backdrop-filter:blur(14px);border:1px solid var(--line-strong)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border:none;background:none;border-radius:16px;color:var(--ink-faint);cursor:pointer;font-size:10.5px}
.tab.active{color:var(--accent);background:rgba(var(--accent-rgb),.14)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:#1b1e44;border:1px solid var(--accent);color:var(--ink);padding:10px 18px;border-radius:99px;font-size:13px;display:none}
</style>
</head>
<body class="locked">
<canvas id="stars"></canvas>

<!-- شاشة القفل -->
<div class="lock" id="lock">
  <div class="lock-card">
    <svg viewBox="0 0 150 150">
      <defs><radialGradient id="lsun" cx="40%" cy="35%"><stop offset="0" stop-color="#fff2c2"/><stop offset=".5" stop-color="#ffb547"/><stop offset="1" stop-color="#e2711d"/></radialGradient></defs>
      <circle cx="75" cy="75" r="62" fill="none" stroke="rgba(255,255,255,.14)"/>
      <circle cx="75" cy="75" r="14" fill="url(#lsun)"/>
    </svg>
    <h1>مركز قيادة العلوم</h1>
    <p class="sub" id="lockSub">مدرسة داوود بن عروة الثقفي</p>
    <form id="lockForm" onsubmit="event.preventDefault(); submitLock();">
      <input type="password" id="pw1" placeholder="الرقم السري" autocomplete="current-password">
      <input type="password" id="pw2" placeholder="أعد كتابة الرقم السري" hidden>
      <div class="lock-msg" id="lockMsg"></div>
      <label class="remember"><input type="checkbox" id="rememberDevice"> تذكّر هذا الجهاز</label>
      <button class="btn block" type="submit" id="lockBtn">دخول</button>
    </form>
  </div>
</div>

<!-- التطبيق الأساسي -->
<div id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <b>مدرسة داوود بن عروة الثقفي</b>
      <span>المعلم: منصور عامر الرحيلي</span>
    </div>
    <button class="icon-btn" onclick="lockNow()">قفل</button>
  </header>

  <main>
    <section id="view-home" class="view active">
      <div class="panel">
        <div class="panel-h"><h3>مرحباً بك يا معلم منصور</h3></div>
        <p class="hint">لوحة قيادة العلوم تعمل بكفاءة وسلاسة تامة.</p>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <div class="tabbar-in">
      <button class="tab active" data-view="home" onclick="showView('home')">الرئيسية</button>
    </div>
  </nav>
</div>

<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
const PW_KEY='mansour_pw_hash_v1', PW_SALT='mansour_pw_salt_v1', REMEMBER_KEY='mansour_remember_v1', SESSION_KEY='mansour_session_v1';
let lockMode = 'login';

async function hashPw(pw, salt){
  const data = salt + '::' + pw;
  try{
    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return 'pw_' + pw;
}

function initLock(){
  const hash = localStorage.getItem(PW_KEY);
  if(!hash){
    lockMode = 'setup';
    $('pw2').hidden = false;
    $('pw1').placeholder = 'أنشئ رقماً سرياً (4 خانات)';
    $('lockBtn').textContent = 'إنشاء الرقم ودخول';
    $('lockSub').textContent = 'أول مرة؟ اختر رقماً سرياً للوحة';
    return;
  }
  if(localStorage.getItem(REMEMBER_KEY) === hash || sessionStorage.getItem(SESSION_KEY) === hash){
    unlock(); return;
  }
}

async function submitLock(){
  const p1 = $('pw1').value;
  if(!p1){ $('lockMsg').textContent = 'الرجاء إدخال الرقم السري'; return; }
  
  if(lockMode === 'setup'){
    if(p1.length < 4){ $('lockMsg').textContent = 'يجب ألا يقل عن 4 خانات'; return; }
    if(p1 !== $('pw2').value){ $('lockMsg').textContent = 'الرقمان غير متطابقان'; return; }
    const salt = 'salt_' + Date.now(), h = await hashPw(p1, salt);
    localStorage.setItem(PW_SALT, salt); localStorage.setItem(PW_KEY, h);
    sessionStorage.setItem(SESSION_KEY, h);
    if($('rememberDevice').checked) localStorage.setItem(REMEMBER_KEY, h);
    unlock();
    return;
  }

  const salt = localStorage.getItem(PW_SALT) || '';
  const h = await hashPw(p1, salt);
  if(h === localStorage.getItem(PW_KEY)){
    sessionStorage.setItem(SESSION_KEY, h);
    if($('rememberDevice').checked) localStorage.setItem(REMEMBER_KEY, h);
    unlock();
  } else {
    $('lockMsg').textContent = 'الرقم السري غير صحيح';
    $('pw1').value = '';
  }
}

function unlock(){
  $('lock').hidden = true;
  document.body.classList.remove('locked');
  $('app').hidden = false;
}

function lockNow(){
  sessionStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(REMEMBER_KEY);
  location.reload();
}

function showView(name){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
}

initLock();
</script>
</body>
</html>
